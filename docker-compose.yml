version: "3.8"

services:
  srs:
    image: ghcr.io/korjavin/german-conjuctions-trainer:master
    container_name: gct
    networks:
      - vaultwarden_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gct.rule=Host(`${DNS_NAME}`)"
      - "traefik.http.routers.gct.entrypoints=websecure"
      - "traefik.http.routers.gct.tls.certresolver=myresolver"
      - "io.containers.autoupdate=image"

    restart: unless-stopped
    volumes:
      - audio_cache:/app/audio_cache
      - database:/data
    environment:
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/data/german.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_URL=${OPENAI_URL}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - MODEL_NAME=${MODEL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - GOOGLE_ADMIN_ID=${GOOGLE_ADMIN_ID}
      - COOKIE_HASH_KEY=${COOKIE_HASH_KEY}
      - COOKIE_BLOCK_KEY=${COOKIE_BLOCK_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - ELEVENLABS_VOICE_SPEED=${ELEVENLABS_VOICE_SPEED}

volumes:
  audio_cache:
  database:

networks:
  vaultwarden_default:
    external: true
