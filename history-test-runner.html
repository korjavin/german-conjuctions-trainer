        <div id="add-topic-hierarchy-preview"></div>
        <div id="add-topic-preview-path"></div>
        <div id="edit-topic-hierarchy-preview"></div>
        <div id="edit-topic-current-path"></div>
        <div id="recently-used-topics"></div>
        <div id="recent-topics-container"></div>
        <div id="edit-recently-used-topics"></div>
        <div id="edit-recent-topics-container"></div>
        <div id="prompt-editor"></div>
        <div id="current-topic-name"></div>
        <div id="prompt-textarea"></div>
        <div id="save-prompt-btn"></div>
        <div id="cancel-edit-btn"></div>

        <div id="version-history"></div>

        <div id="versions-list"></div>

        <div id="history-controls-container"></div>

        <div id="history-pagination"></div>
        <div id="history-prev-btn"></div>
        <div id="history-next-btn"></div>

        <div id="history-filter-ready"></div>
        <div id="history-filter-favorites"></div>

        <div id="history-sort-timing"></div>
        <div id="history-sort-errors"></div>
        <div id="history-sort-date"></div>
    </div>

    <!-- Required template for testing, though we are mostly testing logic not DOM rendering here -->
    <template id="history-item-template">
        <div class="history-item"></div>
    </template>

    <script type="module">
        import { runHistoryTests } from './js/history-test.js';

        // Wait briefly for module imports to resolve then run tests
        setTimeout(() => {
            runHistoryTests();

            // Output summary to DOM for playwright to read easily
            const results = document.createElement('div');
            results.id = 'test-results';
            const hr = window.historyTestResults || { passed: 0, failed: 1, total: 1 };
            results.textContent = `Tests Complete. Passed: ${hr.passed}, Failed: ${hr.failed}`;
            if (hr.failed > 0) {
                results.style.color = 'red';
                results.classList.add('tests-failed');
            } else {
                results.style.color = 'green';
                results.classList.add('tests-passed');
            }
            document.body.appendChild(results);
        }, 500);
    </script>
</body>
</html>
